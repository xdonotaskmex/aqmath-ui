<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Plus Jakarta Sans,Segoe UI,Arial,sans-serif">
<rect width="920" height="380" fill="#050a18"/>
<text x="78" y="22" fill="#e2e8f0" font-size="15" font-weight="700">Max drawdown: fixed versus adaptive threshold</text>
<text x="78" y="38" fill="#7a8ba5" font-size="10">Lower is better. The adaptive (volatility-scaled) threshold reduces max drawdown on both baskets; the gap is largest on the high-vol alt basket.</text>

<!-- Y-axis grid -->
<line x1="78" y1="320" x2="840" y2="320" stroke="#18223a" stroke-width="1"/>
<text x="70" y="324" fill="#7a8ba5" font-size="10" text-anchor="end">0%</text>
<line x1="78" y1="268" x2="840" y2="268" stroke="#18223a" stroke-width="1"/>
<text x="70" y="272" fill="#7a8ba5" font-size="10" text-anchor="end">10%</text>
<line x1="78" y1="216" x2="840" y2="216" stroke="#18223a" stroke-width="1"/>
<text x="70" y="220" fill="#7a8ba5" font-size="10" text-anchor="end">20%</text>
<line x1="78" y1="164" x2="840" y2="164" stroke="#18223a" stroke-width="1"/>
<text x="70" y="168" fill="#7a8ba5" font-size="10" text-anchor="end">30%</text>
<line x1="78" y1="112" x2="840" y2="112" stroke="#18223a" stroke-width="1"/>
<text x="70" y="116" fill="#7a8ba5" font-size="10" text-anchor="end">40%</text>
<line x1="78" y1="60" x2="840" y2="60" stroke="#18223a" stroke-width="1"/>
<text x="70" y="64" fill="#7a8ba5" font-size="10" text-anchor="end">50%</text>

<!-- Scale: 0% at y=320, 50% at y=60. 1% = 5.2px -->

<!-- MAJORS group -->
<!-- Fixed: 25.7% -> height = 25.7 * 5.2 = 133.6, y = 320 - 133.6 = 186.4 -->
<rect x="180" y="186.4" width="65" height="133.6" fill="#f87171" rx="2"/>
<text x="212.5" y="180" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">25.7%</text>
<text x="212.5" y="170" fill="#7a8ba5" font-size="9" text-anchor="middle">Fixed</text>

<!-- Adaptive: 23.1% -> height = 23.1 * 5.2 = 120.1, y = 320 - 120.1 = 199.9 -->
<rect x="260" y="199.9" width="65" height="120.1" fill="#34d399" rx="2"/>
<text x="292.5" y="194" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">23.1%</text>
<text x="292.5" y="184" fill="#7a8ba5" font-size="9" text-anchor="middle">Adaptive</text>

<text x="252" y="345" fill="#e2e8f0" font-size="12" text-anchor="middle">Majors (BTC, ETH, PAXG)</text>

<!-- Improvement arrow for Majors -->
<text x="252" y="360" fill="#34d399" font-size="10" text-anchor="middle">-2.6 pp</text>

<!-- ALTS group -->
<!-- Fixed: 36.8% -> height = 36.8 * 5.2 = 191.4, y = 320 - 191.4 = 128.6 -->
<rect x="530" y="128.6" width="65" height="191.4" fill="#f87171" rx="2"/>
<text x="562.5" y="122" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">36.8%</text>
<text x="562.5" y="112" fill="#7a8ba5" font-size="9" text-anchor="middle">Fixed</text>

<!-- Adaptive: 29.4% -> height = 29.4 * 5.2 = 152.9, y = 320 - 152.9 = 167.1 -->
<rect x="610" y="167.1" width="65" height="152.9" fill="#34d399" rx="2"/>
<text x="642.5" y="161" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">29.4%</text>
<text x="642.5" y="151" fill="#7a8ba5" font-size="9" text-anchor="middle">Adaptive</text>

<text x="602" y="345" fill="#e2e8f0" font-size="12" text-anchor="middle">Alts (high-vol basket)</text>

<!-- Improvement arrow for Alts -->
<text x="602" y="360" fill="#34d399" font-size="10" text-anchor="middle">-7.4 pp</text>

<!-- Legend -->
<rect x="340" y="55" width="14" height="4" fill="#f87171"/>
<text x="360" y="63" fill="#e2e8f0" font-size="11">Fixed threshold (constant drawdown reference)</text>
<rect x="340" y="73" width="14" height="4" fill="#34d399"/>
<text x="360" y="81" fill="#e2e8f0" font-size="11">Adaptive threshold (volatility-scaled)</text>
</svg>
