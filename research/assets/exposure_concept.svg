<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Plus Jakarta Sans,Segoe UI,Arial,sans-serif">
<rect width="920" height="400" fill="#050a18"/>
<text x="78" y="22" fill="#e2e8f0" font-size="15" font-weight="700">Fixed versus adaptive drawdown reference — synthetic crash scenario</text>
<text x="78" y="38" fill="#7a8ba5" font-size="10">Left: portfolio equity during a crash-and-recovery. Right: exposure response. The adaptive threshold scales with volatility; the fixed threshold does not.</text>

<!-- Price / equity curve area -->
<text x="60" y="70" fill="#7a8ba5" font-size="10" text-anchor="end">$100</text>
<text x="60" y="160" fill="#7a8ba5" font-size="10" text-anchor="end">$70</text>
<text x="60" y="250" fill="#7a8ba5" font-size="10" text-anchor="end">$40</text>
<line x1="78" y1="280" x2="440" y2="280" stroke="#18223a" stroke-width="1"/>
<text x="78" y="296" fill="#7a8ba5" font-size="10">Day 0</text>
<text x="200" y="296" fill="#7a8ba5" font-size="10" text-anchor="middle">Day 5</text>
<text x="310" y="296" fill="#7a8ba5" font-size="10" text-anchor="middle">Day 10</text>
<text x="440" y="296" fill="#7a8ba5" font-size="10" text-anchor="end">Day 20</text>

<!-- Grid lines -->
<line x1="78" y1="68" x2="440" y2="68" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="78" y1="158" x2="440" y2="158" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="78" y1="248" x2="440" y2="248" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>

<!-- Buy & Hold equity curve (crash and V-recovery) -->
<polyline points="78,68 140,80 200,130 260,200 310,248 340,220 380,140 420,80 440,68" fill="none" stroke="#475569" stroke-width="2"/>
<text x="445" y="72" fill="#475569" font-size="10">Buy &amp; Hold</text>

<!-- Fixed threshold equity (gets stuck at low exposure during recovery) -->
<polyline points="78,68 140,76 200,110 260,155 310,195 340,188 380,165 420,120 440,100" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6,3"/>
<text x="445" y="104" fill="#f87171" font-size="10">Fixed threshold</text>

<!-- Adaptive threshold equity (follows B&H closer on recovery) -->
<polyline points="78,68 140,74 200,105 260,148 310,188 340,172 380,120 420,78 440,70" fill="none" stroke="#34d399" stroke-width="2"/>
<text x="445" y="74" fill="#34d399" font-size="10" dy="-6">Adaptive threshold</text>

<!-- Crash annotation -->
<line x1="310" y1="55" x2="310" y2="260" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
<text x="310" y="310" fill="#f59e0b" font-size="10" text-anchor="middle">Crash bottom</text>

<!-- RIGHT PANEL: Exposure response -->
<line x1="510" y1="280" x2="870" y2="280" stroke="#18223a" stroke-width="1"/>
<text x="510" y="296" fill="#7a8ba5" font-size="10">Day 0</text>
<text x="620" y="296" fill="#7a8ba5" font-size="10" text-anchor="middle">Day 5</text>
<text x="730" y="296" fill="#7a8ba5" font-size="10" text-anchor="middle">Day 10</text>
<text x="870" y="296" fill="#7a8ba5" font-size="10" text-anchor="end">Day 20</text>

<text x="500" y="70" fill="#7a8ba5" font-size="10" text-anchor="end">100%</text>
<text x="500" y="155" fill="#7a8ba5" font-size="10" text-anchor="end">50%</text>
<text x="500" y="245" fill="#7a8ba5" font-size="10" text-anchor="end">0%</text>

<line x1="510" y1="68" x2="870" y2="68" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="510" y1="153" x2="870" y2="153" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>
<line x1="510" y1="243" x2="870" y2="243" stroke="#18223a" stroke-width="0.5" stroke-dasharray="3,3"/>

<text x="690" y="52" fill="#e2e8f0" font-size="12" font-weight="600">Exposure over time</text>

<!-- Fixed threshold exposure (drops to near zero, stays low during recovery) -->
<polyline points="510,68 570,80 620,160 680,230 730,243 750,240 790,220 830,170 870,130" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6,3"/>

<!-- Adaptive threshold exposure (drops but recovers faster) -->
<polyline points="510,68 570,78 620,140 680,210 730,225 750,200 790,140 830,85 870,72" fill="none" stroke="#34d399" stroke-width="2"/>

<!-- Recovery annotation -->
<line x1="730" y1="55" x2="730" y2="260" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
<text x="730" y="310" fill="#f59e0b" font-size="10" text-anchor="middle">Crash bottom</text>

<!-- "Locked out" zone for fixed -->
<rect x="730" y="225" width="100" height="18" rx="3" fill="#f8717130" stroke="#f87171" stroke-width="0.5"/>
<text x="780" y="237" fill="#f87171" font-size="9" text-anchor="middle">locked out</text>

<!-- Legend -->
<rect x="560" y="340" width="14" height="4" fill="#f87171"/>
<text x="580" y="348" fill="#e2e8f0" font-size="11">Fixed threshold — binary trigger, slow re-entry</text>
<rect x="560" y="358" width="14" height="4" fill="#34d399"/>
<text x="580" y="366" fill="#e2e8f0" font-size="11">Adaptive threshold — vol-scaled, V-bounce re-entry</text>
<rect x="560" y="376" width="14" height="4" fill="#475569"/>
<text x="580" y="384" fill="#e2e8f0" font-size="11">Buy &amp; Hold — fully exposed throughout</text>
</svg>
