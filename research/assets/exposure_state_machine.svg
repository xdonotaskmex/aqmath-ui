<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Plus Jakarta Sans,Segoe UI,Arial,sans-serif">
<rect width="920" height="400" fill="#050a18"/>
<text x="460" y="22" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">Execution state machine — continuous regime modulator</text>
<text x="460" y="38" fill="#7a8ba5" font-size="10" text-anchor="middle">Three operational zones derived from the downside signature. Exposure is continuous; zone boundaries are diagnostic thresholds.</text>

<!-- NORMAL state box -->
<rect x="60" y="80" width="220" height="120" rx="8" fill="#0d1a2e" stroke="#34d399" stroke-width="2"/>
<text x="170" y="108" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">NORMAL</text>
<text x="170" y="128" fill="#e2e8f0" font-size="11" text-anchor="middle">Full risky allocation</text>
<text x="170" y="146" fill="#7a8ba5" font-size="10" text-anchor="middle">Downside signature below threshold</text>
<text x="170" y="164" fill="#7a8ba5" font-size="10" text-anchor="middle">DCA deployed into basket</text>
<text x="170" y="182" fill="#7a8ba5" font-size="10" text-anchor="middle">No active risk reduction</text>

<!-- TELEMETRY ALERT state box -->
<rect x="350" y="80" width="220" height="120" rx="8" fill="#0d1a2e" stroke="#f59e0b" stroke-width="2"/>
<text x="460" y="108" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="middle">TELEMETRY ALERT</text>
<text x="460" y="128" fill="#e2e8f0" font-size="11" text-anchor="middle">Exposure ramping down</text>
<text x="460" y="146" fill="#7a8ba5" font-size="10" text-anchor="middle">Composite risk rising (dd + vol)</text>
<text x="460" y="164" fill="#7a8ba5" font-size="10" text-anchor="middle">Asymmetric ramp: exit fast, enter slow</text>
<text x="460" y="182" fill="#7a8ba5" font-size="10" text-anchor="middle">Parked DCA in stablecoin</text>

<!-- HARD ENFORCEMENT state box -->
<rect x="640" y="80" width="220" height="120" rx="8" fill="#0d1a2e" stroke="#f87171" stroke-width="2"/>
<text x="750" y="108" fill="#f87171" font-size="14" font-weight="700" text-anchor="middle">HARD ENFORCEMENT</text>
<text x="750" y="128" fill="#e2e8f0" font-size="11" text-anchor="middle">Deterministic de-risk</text>
<text x="750" y="146" fill="#7a8ba5" font-size="10" text-anchor="middle">Shield absorbs crash at min risk</text>
<text x="750" y="164" fill="#7a8ba5" font-size="10" text-anchor="middle">V-bounce re-entry confirmation</text>
<text x="750" y="182" fill="#7a8ba5" font-size="10" text-anchor="middle">Capital protection active</text>

<!-- Transition arrows -->
<!-- Normal → Alert -->
<line x1="280" y1="120" x2="345" y2="120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
<text x="312" y="112" fill="#f59e0b" font-size="9" text-anchor="middle">stress rises</text>

<!-- Alert → Hard -->
<line x1="570" y1="120" x2="635" y2="120" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
<text x="602" y="112" fill="#f87171" font-size="9" text-anchor="middle">deep stress</text>

<!-- Hard → Alert (recovery) -->
<line x1="635" y1="160" x2="570" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
<text x="602" y="178" fill="#34d399" font-size="9" text-anchor="middle">V-bounce</text>

<!-- Alert → Normal (recovery) -->
<line x1="345" y1="160" x2="280" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
<text x="312" y="178" fill="#34d399" font-size="9" text-anchor="middle">calm</text>

<!-- Arrow markers -->
<defs>
<marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f59e0b"/></marker>
<marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f87171"/></marker>
<marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#34d399"/></marker>
</defs>

<!-- Signal computation panel -->
<rect x="60" y="230" width="380" height="150" rx="6" fill="#0a1225" stroke="#18223a" stroke-width="1"/>
<text x="78" y="252" fill="#e2e8f0" font-size="12" font-weight="600">Signal pipeline (every daily close)</text>
<text x="78" y="278" fill="#06b6d4" font-size="11">1. Drawdown from all-time basket peak</text>
<text x="78" y="300" fill="#06b6d4" font-size="11">2. Trailing annualised downside volatility</text>
<text x="78" y="322" fill="#a855f7" font-size="11">3. Composite risk = weighted combination</text>
<text x="78" y="344" fill="#34d399" font-size="11">4. Target exposure = inverse of risk</text>
<text x="78" y="366" fill="#7a8ba5" font-size="10">Asymmetric ramp: de-risk fast, re-enter on confirmed bounce</text>

<!-- Key properties panel -->
<rect x="480" y="230" width="380" height="150" rx="6" fill="#0a1225" stroke="#18223a" stroke-width="1"/>
<text x="498" y="252" fill="#e2e8f0" font-size="12" font-weight="600">Design invariants</text>
<text x="498" y="278" fill="#e2e8f0" font-size="11">&#x2022; Telemetry observes — only exposure reduction protects</text>
<text x="498" y="300" fill="#e2e8f0" font-size="11">&#x2022; Vol-scaled threshold self-tunes to each basket's sigma</text>
<text x="498" y="322" fill="#e2e8f0" font-size="11">&#x2022; No binary state — zones are diagnostic, not hard switches</text>
<text x="498" y="344" fill="#e2e8f0" font-size="11">&#x2022; Relative token weights never altered — only total exposure</text>
<text x="498" y="366" fill="#e2e8f0" font-size="11">&#x2022; Deterministic: same inputs always produce same exposure</text>
</svg>
