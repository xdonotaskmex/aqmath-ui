# CI gate for the GitHub Pages site: every push must satisfy the
# single-stamp invariant and the full page audit (unique bodies, one
# h1, canonicals, sitemap sync, no broken internal links).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Version stamps must be current
        run: python tools/stamp_version.py --check
      - name: Audit all published pages
        run: python tools/audit_pages.py
      - name: No hardcoded credentials in the repo
        run: >
          if grep -rInE "(JWT_SECRET|COLLECTOR_SECRET|DATABASE_URL|ADMIN_SECRET|IP_HASH_PEPPER)\s*=\s*['\"][A-Za-z0-9_+/=-]{16,}"
          --include='*.js' --include='*.json' --include='*.html' --include='*.yml' .; then
          echo "::error::Hardcoded credentials detected"; exit 1; fi
      - name: No real beta keys in the repo
        run: >
          if grep -rInE "AQMBETA-[A-Z0-9]{4}-[A-Z0-9]{4}"
          --include='*.js' --include='*.json' --include='*.html' .
          | grep -v "AQMBETA-XXXX-XXXX" | grep -v "AQMBETA-TEST"; then
          echo "::error::Real beta keys detected"; exit 1; fi
      - name: No cloud provider keys in the repo
        run: >
          if grep -rInE "(AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|sk_live_[a-zA-Z0-9]{24})"
          --include='*.js' --include='*.json' --include='*.html' --include='*.yml' .; then
          echo "::error::Cloud provider keys detected"; exit 1; fi
